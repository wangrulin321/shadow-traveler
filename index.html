<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>影灯旅人 · 光影滑行扩展版</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e9f1f4;
      --muted: #8aa0aa;
      --deep: #08131c;
      --panel: #0e1d28;
      --panel-2: #132736;
      --line: rgba(160, 210, 221, .18);
      --cyan: #73d6e6;
      --cyan-strong: #2eb6ce;
      --amber: #f2c969;
      --coral: #ef8d82;
      --good: #99dfc0;
      --board-size: min(74vw, 650px);
    }

    * { box-sizing: border-box; }

    html { touch-action: manipulation; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      -webkit-touch-callout: none;
      background:
        linear-gradient(130deg, #07131b 0%, #0b1c28 48%, #102633 100%);
      letter-spacing: 0;
    }

    button { font: inherit; }

    .app-shell {
      width: min(1380px, calc(100% - 36px));
      margin: 0 auto;
      min-height: 100vh;
      padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
      padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(242, 201, 105, .65);
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #172a36;
      box-shadow: 0 0 0 5px rgba(242, 201, 105, .05);
    }

    .brand-mark svg { width: 28px; height: 28px; }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--amber);
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(22px, 3vw, 30px); line-height: 1; font-weight: 680; }

    .top-actions { display: flex; gap: 8px; }

    .icon-button {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: rgba(16, 35, 47, .78);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 21px;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }

    .icon-button:hover { border-color: rgba(115, 214, 230, .8); background: #173142; }
    .icon-button:active { transform: translateY(1px); }

    .game-layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 32px;
      align-items: start;
      padding: 28px 0 44px;
    }

    .play-area { min-width: 0; }

    .level-strip {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .level-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--muted);
      background: rgba(16, 35, 47, .72);
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s ease;
    }

    .level-button:hover { color: var(--ink); border-color: rgba(115, 214, 230, .55); }
    .level-button.active { color: var(--deep); background: var(--amber); border-color: var(--amber); font-weight: 700; }
    .level-button.complete:not(.active)::after { content: "  ✓"; color: var(--good); }

    .board-frame {
      width: var(--board-size);
      max-width: 100%;
      aspect-ratio: 1;
      margin: 0 auto;
      padding: clamp(9px, 1.6vw, 15px);
      border: 1px solid rgba(157, 213, 224, .25);
      border-radius: 18px;
      background: #0b202d;
      box-shadow: 0 28px 60px rgba(0, 0, 0, .24), inset 0 0 0 1px rgba(255,255,255,.03);
    }

    .board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: clamp(3px, .65vw, 6px);
      padding: 5px;
      border-radius: 11px;
      background: #0b1720;
      position: relative;
      isolation: isolate;
    }

    .cell {
      min-width: 0;
      min-height: 0;
      position: relative;
      border: 0;
      border-radius: 7px;
      cursor: default;
      overflow: visible;
      background: #1c3949;
      transition: background .25s ease, box-shadow .25s ease, transform .18s ease;
    }

    .cell:nth-child(2n) { background: #203f4e; }
    .cell:nth-child(16n + 1), .cell:nth-child(16n + 3), .cell:nth-child(16n + 5), .cell:nth-child(16n + 7),
    .cell:nth-child(16n + 10), .cell:nth-child(16n + 12), .cell:nth-child(16n + 14), .cell:nth-child(16n + 16) { background: #1b3545; }
    .cell.lit { background: #b7c58b; box-shadow: inset 0 0 0 1px rgba(247, 224, 133, .48); }
    .cell.lit:nth-child(2n) { background: #becd94; }
    .cell.dark { background: #10222d; box-shadow: inset 0 0 0 1px rgba(79, 117, 130, .2); }
    .cell.goal-cell { box-shadow: inset 0 0 0 2px rgba(242, 201, 105, .72); }

    .cell.wall {
      cursor: default;
      background: #1b2328 !important;
      box-shadow: inset 0 0 0 1px rgba(196, 215, 219, .22), 0 4px 0 rgba(0,0,0,.15);
    }

    .cell.wall::before,
    .cell.wall::after {
      content: "";
      position: absolute;
      left: 14%;
      right: 14%;
      height: 25%;
      border-radius: 3px;
      background: #aebdc0;
      box-shadow: 0 0 0 1px rgba(255,255,255,.15) inset;
      opacity: .84;
    }

    .cell.wall::before { top: 18%; }
    .cell.wall::after { bottom: 18%; width: 58%; left: 27%; }

    .cell.shadow-wall {
      cursor: default;
      background: #10191d !important;
      box-shadow: inset 0 0 0 1px rgba(96, 135, 144, .42), 0 4px 0 rgba(0,0,0,.15);
    }

    .cell.shadow-wall::before,
    .cell.shadow-wall::after {
      content: "";
      position: absolute;
      left: 16%;
      right: 16%;
      height: 14%;
      border-radius: 2px;
      background: #47636a;
      opacity: .78;
      transform: skewX(-25deg);
    }

    .cell.shadow-wall::before { top: 25%; }
    .cell.shadow-wall::after { bottom: 25%; width: 55%; left: 29%; }

    .cell.lamp-cell { cursor: default; }

    .cell.lamp-cell::after {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      border: 1px solid rgba(255, 244, 177, .42);
      pointer-events: none;
    }

    .lamp-icon {
      position: absolute;
      inset: 20%;
      display: grid;
      place-items: center;
      z-index: 2;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.18));
    }
    .lamp-icon svg { width: 100%; height: 100%; }

    .goal-icon {
      position: absolute;
      inset: 15%;
      display: grid;
      place-items: center;
      z-index: 2;
    }
    .goal-icon svg { width: 100%; height: 100%; }

    .piece {
      position: absolute;
      inset: 14%;
      z-index: 4;
      display: grid;
      place-items: center;
      transition: transform .08s linear, opacity .2s ease;
      pointer-events: none;
    }

    .piece svg { width: 100%; height: 100%; overflow: visible; }
    .cell.piece-cell { cursor: pointer; }
    .cell.piece-cell:hover { transform: translateY(-2px); }
    .cell.path::before {
      content: "";
      position: absolute;
      inset: 18%;
      border: 1px dashed rgba(255, 255, 255, .62);
      border-radius: 50%;
      animation: pathPulse 1.1s ease-in-out infinite;
    }

    .cell.invalid-place { cursor: not-allowed; }
    .cell.wall-placeable { cursor: crosshair; }
    .cell.wall-placeable:hover { box-shadow: inset 0 0 0 2px rgba(115, 214, 230, .8); }
    .cell.wall-placeable::before { content: "+"; position: absolute; inset: 0; display: grid; place-items: center; color: rgba(229, 246, 247, .66); font-size: clamp(18px, 3vw, 27px); font-weight: 300; }

    @keyframes pathPulse { 50% { transform: scale(.82); opacity: .32; } }

    .direction-panel {
      width: min(420px, 100%);
      margin: 18px auto 0;
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(2, 58px);
      justify-content: center;
      gap: 8px;
    }

    .direction-button {
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: #102632;
      cursor: pointer;
      font-size: 25px;
      display: grid;
      place-items: center;
      transition: all .2s ease;
    }

    .direction-button:hover:not(:disabled) { color: var(--deep); background: var(--cyan); border-color: var(--cyan); transform: translateY(-2px); }
    .direction-button:disabled { cursor: not-allowed; opacity: .3; }
    .direction-button.up { grid-column: 2; grid-row: 1; }
    .direction-button.left { grid-column: 1; grid-row: 2; }
    .direction-button.down { grid-column: 2; grid-row: 2; }
    .direction-button.right { grid-column: 3; grid-row: 2; }

    .side-panel { display: flex; flex-direction: column; gap: 14px; }

    .status-panel, .tool-panel, .legend-panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(14, 29, 40, .86);
      box-shadow: 0 12px 30px rgba(0,0,0,.12);
    }

    .status-panel { padding: 20px; }
    .section-label { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
    .level-title { margin-top: 8px; font-size: 23px; font-weight: 680; }
    .level-copy { margin-top: 7px; color: var(--muted); font-size: 13px; line-height: 1.55; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 18px;
    }
    .stat {
      padding: 11px 12px;
      border-radius: 9px;
      background: #122734;
      border: 1px solid rgba(160, 210, 221, .1);
    }
    .stat .label { display: block; color: var(--muted); font-size: 11px; }
    .stat .value { display: block; margin-top: 4px; font-size: 20px; font-weight: 700; }

    .goal-row {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--amber);
      font-size: 13px;
    }
    .goal-mini { width: 22px; height: 22px; }
    .goal-mini svg { width: 100%; height: 100%; }

    .tool-panel { padding: 14px; }
    .wall-tool {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      color: var(--ink);
      border: 1px solid rgba(115, 214, 230, .22);
      border-radius: 10px;
      background: #122b38;
      cursor: pointer;
      text-align: left;
      transition: all .2s ease;
    }
    .wall-tool:hover { border-color: var(--cyan); background: #173746; }
    .wall-tool.selected { border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan); }
    .wall-tool:disabled { cursor: not-allowed; opacity: .4; }
    .wall-swatch { width: 34px; height: 34px; border-radius: 8px; background: #1b2328; display: grid; place-items: center; flex: 0 0 auto; }
    .wall-swatch::before { content: ""; width: 21px; height: 6px; border-radius: 2px; background: #b7c4c4; box-shadow: 0 8px 0 #b7c4c4; }
    .wall-tool-copy { flex: 1; }
    .wall-tool-copy strong { display: block; font-size: 14px; }
    .wall-tool-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .wall-count { color: var(--cyan); font-size: 20px; font-weight: 750; }

    .legend-panel { padding: 15px 16px; }
    .legend-list { display: grid; gap: 10px; margin-top: 12px; }
    .legend-item { display: flex; align-items: center; gap: 10px; color: #c6d5d9; font-size: 12px; }
    .legend-dot { width: 18px; height: 18px; border-radius: 5px; flex: 0 0 auto; }
    .legend-dot.light { background: #becd94; border: 1px solid rgba(247, 224, 133, .48); }
    .legend-dot.dark { background: #10222d; border: 1px solid rgba(115, 168, 183, .34); }
    .legend-dot.wall { background: #1b2328; position: relative; }
    .legend-dot.wall::after { content:""; position:absolute; inset:5px 3px; border-top:3px solid #b7c4c4; border-bottom:3px solid #b7c4c4; }

    .answer-panel {
      border: 1px solid rgba(242, 201, 105, .25);
      border-radius: 14px;
      background: rgba(35, 34, 29, .58);
      overflow: hidden;
    }
    .answer-header {
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .answer-header .section-label { color: var(--amber); }
    .answer-toggle {
      border: 1px solid rgba(242, 201, 105, .34);
      border-radius: 8px;
      padding: 6px 9px;
      color: var(--amber);
      background: rgba(242, 201, 105, .08);
      cursor: pointer;
      font-size: 11px;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .answer-toggle:hover { border-color: var(--amber); background: rgba(242, 201, 105, .15); }
    .answer-toggle:active { transform: translateY(1px); }
    .answer-content { padding: 0 16px 16px; }
    .answer-content[hidden] { display: none; }
    .answer-row { display: grid; gap: 7px; margin-top: 11px; }
    .answer-row:first-child { margin-top: 0; }
    .answer-label { color: var(--muted); font-size: 11px; }
    .answer-value { color: var(--ink); font-size: 13px; line-height: 1.45; }
    .answer-moves { display: flex; flex-wrap: wrap; gap: 6px; }
    .answer-chip {
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid rgba(115, 214, 230, .28);
      border-radius: 8px;
      color: var(--cyan);
      background: rgba(115, 214, 230, .08);
      font-size: 17px;
      font-weight: 700;
    }
    .answer-chip b { color: var(--muted); font-size: 10px; font-weight: 500; }
    .answer-note { color: #b9c9cb; font-size: 11px; line-height: 1.55; }

    .footer-note {
      padding: 15px 0 20px;
      color: #6e858e;
      border-top: 1px solid var(--line);
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(4, 11, 15, .72);
      backdrop-filter: blur(5px);
    }
    .modal-backdrop[hidden] { display: none; }
    .modal {
      width: min(420px, 100%);
      border: 1px solid rgba(115, 214, 230, .32);
      border-radius: 16px;
      padding: 25px;
      background: #0e202c;
      box-shadow: 0 24px 80px rgba(0,0,0,.4);
    }
    .modal-kicker { color: var(--amber); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .modal h2 { margin-top: 7px; font-size: 26px; }
    .modal p { margin-top: 9px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .modal-actions { display: flex; gap: 9px; margin-top: 21px; }
    .modal-action {
      flex: 1;
      min-height: 43px;
      border-radius: 9px;
      border: 1px solid var(--line);
      cursor: pointer;
      color: var(--ink);
      background: #173140;
    }
    .modal-action.primary { color: var(--deep); background: var(--cyan); border-color: var(--cyan); font-weight: 700; }
    .modal-action:hover { filter: brightness(1.08); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 25;
      transform: translate(-50%, 15px);
      opacity: 0;
      pointer-events: none;
      padding: 10px 14px;
      border: 1px solid rgba(239, 141, 130, .45);
      border-radius: 9px;
      background: #3a2225;
      color: #ffd9d3;
      font-size: 12px;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 930px) {
      :root { --board-size: min(88vw, 650px); }
      .game-layout { grid-template-columns: 1fr; gap: 22px; }
      .side-panel { width: min(650px, 100%); margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
      .status-panel { grid-column: 1 / -1; }
      .legend-panel { grid-column: 1 / -1; }
    }

    @media (max-width: 560px) {
      .app-shell { width: min(100% - 22px, 1380px); }
      .topbar { min-height: 78px; }
      .game-layout { padding-top: 18px; }
      .brand-mark { width: 36px; height: 36px; border-radius: 10px; }
      h1 { font-size: 22px; }
      .eyebrow { font-size: 9px; }
      .side-panel { display: flex; }
      .status-panel { padding: 16px; }
      .level-title { font-size: 21px; }
      .direction-panel { margin-top: 13px; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); }
      .direction-button { border-radius: 10px; }
      .footer-note { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 5v4M8.7 10.8l2.8 2.8M5 22h4M31.3 10.8l-2.8 2.8M35 22h-4" stroke="#F2C969" stroke-width="2" stroke-linecap="round"/>
            <path d="M13 18.5h14l-2.3 8H15.3L13 18.5Z" fill="#F2C969" stroke="#FFF4C2" stroke-width="1.6"/>
            <path d="M15.8 28.5h8.4M20 26.5v7" stroke="#73D6E6" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <p class="eyebrow">影灯旅人 · 光影滑行</p>
          <h1>光线会停，黑暗不会。</h1>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="restartButton" type="button" title="重置本关" aria-label="重置本关">↻</button>
      </div>
    </header>

    <main class="game-layout">
      <section class="play-area" aria-label="游戏棋盘">
        <nav class="level-strip" id="levelStrip" aria-label="关卡选择"></nav>
        <div class="board-frame">
          <div class="board" id="board" role="grid" aria-label="8乘8棋盘"></div>
        </div>
        <div class="direction-panel" aria-label="移动方向">
          <button class="direction-button up" data-direction="up" type="button" title="向上" aria-label="向上">↑</button>
          <button class="direction-button left" data-direction="left" type="button" title="向左" aria-label="向左">←</button>
          <button class="direction-button down" data-direction="down" type="button" title="向下" aria-label="向下">↓</button>
          <button class="direction-button right" data-direction="right" type="button" title="向右" aria-label="向右">→</button>
        </div>
      </section>

      <aside class="side-panel">
        <section class="status-panel">
          <p class="section-label">当前关卡</p>
          <h2 class="level-title" id="levelTitle">第一束光</h2>
          <p class="level-copy" id="levelCopy">让亮色惧暗小人沿光线抵达归宿门。</p>
          <div class="stat-grid">
            <div class="stat"><span class="label">墙体库存</span><span class="value" id="wallValue">1</span></div>
            <div class="stat"><span class="label">已移动</span><span class="value" id="moveValue">0</span></div>
          </div>
          <div class="goal-row">
            <span class="goal-mini" aria-hidden="true">
              <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="14" stroke="#F2C969" stroke-width="2"/><circle cx="20" cy="20" r="8" stroke="#73D6E6" stroke-width="2"/><circle cx="20" cy="20" r="2.5" fill="#F2C969"/></svg>
            </span>
            <span>归宿门：<strong id="goalLabel">C5</strong></span>
          </div>
        </section>

        <section class="tool-panel">
          <button class="wall-tool" id="wallTool" type="button" title="选择后点击棋盘放置墙体">
            <span class="wall-swatch" aria-hidden="true"></span>
            <span class="wall-tool-copy"><strong>放置墙体</strong><span>选择空格，改变光路</span></span>
            <span class="wall-count" id="wallCount">×1</span>
          </button>
        </section>

        <section class="legend-panel">
          <p class="section-label">场上状态</p>
          <div class="legend-list">
            <div class="legend-item"><span class="legend-dot light"></span><span>光区 · 亮色小人的安全地带</span></div>
            <div class="legend-item"><span class="legend-dot dark"></span><span>暗区 · 亮色小人无法停留</span></div>
            <div class="legend-item"><span class="legend-dot wall"></span><span>墙体 · 挡住移动，也挡住光</span></div>
          </div>
        </section>

        <section class="answer-panel" aria-labelledby="answerHeading">
          <div class="answer-header">
            <p class="section-label" id="answerHeading">本关答案</p>
            <button class="answer-toggle" id="answerToggle" type="button" aria-controls="answerContent" aria-expanded="true">隐藏答案</button>
          </div>
          <div class="answer-content" id="answerContent">
            <div class="answer-row">
              <span class="answer-label">墙体摆放</span>
              <span class="answer-value" id="answerWalls">无需放置墙体</span>
            </div>
            <div class="answer-row">
              <span class="answer-label">移动顺序</span>
              <span class="answer-moves" id="answerMoves"></span>
            </div>
            <div class="answer-row">
              <span class="answer-label">解题思路</span>
              <span class="answer-note" id="answerNote"></span>
            </div>
          </div>
        </section>
      </aside>
    </main>

    <footer class="footer-note">
      <span>8 × 8 光影滑行解谜</span>
      <span>方向键 / WASD 也可以移动</span>
    </footer>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <p class="modal-kicker" id="modalKicker">关卡结束</p>
      <h2 id="modalTitle">光线断了</h2>
      <p id="modalCopy">亮色惧暗小人滑进了黑暗。</p>
      <div class="modal-actions">
        <button class="modal-action" id="modalRestart" type="button">重新开始</button>
        <button class="modal-action primary" id="modalNext" type="button">下一关</button>
      </div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
